name: CI

# Só em PR. O deploy (merge na main) está em deploy.yml.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Formatação
        run: pnpm exec prettier --check .
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Testes
        run: pnpm test:ci
      # Sem segredo: sem DSN, sem token do Sentry, sem envio de sourcemaps.
      - name: Build
        run: pnpm build

  # Teste de fumaça: o Worker no simulador do Wrangler e dois ou mais Chromium com mídia falsa.
  # Sem segredo: a chave do Turnstile é a de teste pública (apps/api/.dev.vars.example).
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Versão do Playwright
        id: playwright
        run: echo "version=$(pnpm --filter @sualive/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache do Chromium do Playwright
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Instalar o Chromium e as dependências do sistema
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @sualive/e2e exec playwright install --with-deps --only-shell chromium
      - name: Instalar só as dependências do sistema (Chromium veio do cache)
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @sualive/e2e exec playwright install-deps chromium
      # O turbo faz o build (front e Worker) antes do teste.
      - name: Teste de fumaça
        run: pnpm e2e
      - name: Relatório e traces do Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
