name: Deploy

# Merge na main publica homologação, verifica e só então publica produção.
# Em cada ambiente: build → migrations do D1 → deploy do Worker → verificação.
on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"

jobs:
  staging:
    name: homologação
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build
        env:
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN_WEB }}
          VITE_CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN_STAGING }}
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_ENVIRONMENT: staging
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm build

      - name: Migrations do D1 (homologação)
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply sualive-staging --remote --env staging

      - name: Deploy do Worker (homologação)
        working-directory: apps/api
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_API }}
        run: |
          args=(--env staging --var "COMMIT_SHA:${GITHUB_SHA}")
          if [ -n "${SENTRY_DSN}" ]; then
            secrets_file="${RUNNER_TEMP}/worker-secrets.json"
            trap 'rm -f "${secrets_file}"' EXIT
            node -e 'require("fs").writeFileSync(process.argv[1], JSON.stringify({ SENTRY_DSN: process.env.SENTRY_DSN }), { mode: 0o600 })' "${secrets_file}"
            args+=(--secrets-file "${secrets_file}")
          fi
          pnpm exec wrangler deploy "${args[@]}"

      - name: Verificação (homologação)
        env:
          BASE_URL: ${{ vars.STAGING_URL }}
        run: node scripts/smoke.mjs "${BASE_URL}" "${GITHUB_SHA}"

  production:
    name: produção
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build
        env:
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN_WEB }}
          VITE_CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_ENVIRONMENT: production
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm build

      # `--env=""` mira o nível de cima do wrangler.jsonc (produção) de forma explícita.
      - name: Migrations do D1 (produção)
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply sualive --remote --env=""

      - name: Deploy do Worker (produção)
        working-directory: apps/api
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_API }}
        run: |
          args=(--env="" --var "COMMIT_SHA:${GITHUB_SHA}")
          if [ -n "${SENTRY_DSN}" ]; then
            secrets_file="${RUNNER_TEMP}/worker-secrets.json"
            trap 'rm -f "${secrets_file}"' EXIT
            node -e 'require("fs").writeFileSync(process.argv[1], JSON.stringify({ SENTRY_DSN: process.env.SENTRY_DSN }), { mode: 0o600 })' "${secrets_file}"
            args+=(--secrets-file "${secrets_file}")
          fi
          pnpm exec wrangler deploy "${args[@]}"

      - name: Verificação (produção)
        env:
          BASE_URL: ${{ vars.PRODUCTION_URL }}
        run: node scripts/smoke.mjs "${BASE_URL}" "${GITHUB_SHA}"
