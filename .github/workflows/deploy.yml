name: Deploy

# Merge na main publica homologação, verifica e só então publica produção.
# Em cada ambiente: build → migrations do D1 → deploy do Worker → verificação.
on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"

jobs:
  staging:
    name: homologação
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build
        env:
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN_WEB }}
          VITE_CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN_STAGING }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY_STAGING }}
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_ENVIRONMENT: staging
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm build

      - name: Migrations do D1 (homologação)
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply sualive-staging --remote --env staging

      - name: Deploy do Worker (homologação)
        working-directory: apps/api
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_API }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY_STAGING }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET_STAGING }}
          TURN_KEY_ID: ${{ secrets.TURN_KEY_ID_STAGING }}
          TURN_KEY_API_TOKEN: ${{ secrets.TURN_KEY_API_TOKEN_STAGING }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID_STAGING }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET_STAGING }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID_STAGING }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET_STAGING }}
          WOOVI_APP_ID: ${{ secrets.WOOVI_APP_ID_STAGING }}
          WOOVI_WEBHOOK_SECRET: ${{ secrets.WOOVI_WEBHOOK_SECRET_STAGING }}
        run: |
          secrets_file="${RUNNER_TEMP}/worker-secrets.json"
          trap 'rm -f "${secrets_file}"' EXIT
          node ../../scripts/write-worker-secrets.mjs "${secrets_file}" SENTRY_DSN TURNSTILE_SECRET_KEY SESSION_SECRET TURN_KEY_ID TURN_KEY_API_TOKEN GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET DISCORD_CLIENT_ID DISCORD_CLIENT_SECRET WOOVI_APP_ID WOOVI_WEBHOOK_SECRET
          pnpm exec wrangler deploy --env staging --var "COMMIT_SHA:${GITHUB_SHA}" --secrets-file "${secrets_file}"

      - name: Verificação (homologação)
        env:
          BASE_URL: ${{ vars.STAGING_URL }}
        run: node scripts/smoke.mjs "${BASE_URL}" "${GITHUB_SHA}"

  production:
    name: produção
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build
        env:
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN_WEB }}
          VITE_CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_ENVIRONMENT: production
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm build

      # `--env=""` mira o nível de cima do wrangler.jsonc (produção) de forma explícita.
      - name: Migrations do D1 (produção)
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply sualive --remote --env=""

      - name: Deploy do Worker (produção)
        working-directory: apps/api
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_API }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          TURN_KEY_ID: ${{ secrets.TURN_KEY_ID }}
          TURN_KEY_API_TOKEN: ${{ secrets.TURN_KEY_API_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          WOOVI_APP_ID: ${{ secrets.WOOVI_APP_ID }}
          WOOVI_WEBHOOK_SECRET: ${{ secrets.WOOVI_WEBHOOK_SECRET }}
        run: |
          secrets_file="${RUNNER_TEMP}/worker-secrets.json"
          trap 'rm -f "${secrets_file}"' EXIT
          node ../../scripts/write-worker-secrets.mjs "${secrets_file}" SENTRY_DSN TURNSTILE_SECRET_KEY SESSION_SECRET TURN_KEY_ID TURN_KEY_API_TOKEN GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET DISCORD_CLIENT_ID DISCORD_CLIENT_SECRET WOOVI_APP_ID WOOVI_WEBHOOK_SECRET
          pnpm exec wrangler deploy --env="" --var "COMMIT_SHA:${GITHUB_SHA}" --secrets-file "${secrets_file}"

      - name: Verificação (produção)
        env:
          BASE_URL: ${{ vars.PRODUCTION_URL }}
        run: node scripts/smoke.mjs "${BASE_URL}" "${GITHUB_SHA}"
