# Gates locais. O repositório inteiro (lint, typecheck, testes e build completos) roda no CI.
# Nunca pule os hooks (`--no-verify`, LEFTHOOK=0).

# Só os arquivos em stage. Meta: < 10 s.
pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{js,mjs,cjs,jsx,ts,tsx,json,jsonc,css,html,yml,yaml}"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{js,mjs,cjs,jsx,ts,tsx}"
      # Sem informação de tipos (os tipos ficam no pre-push e no CI).
      run: pnpm exec eslint --cache --cache-location node_modules/.cache/eslint/ --no-warn-ignored {staged_files}

# Só o typecheck incremental (cache do turbo + um tsbuildinfo por pacote). Meta: < 1 min.
# Os testes ligados ao diff (`pnpm test:related`) rodam antes de abrir o PR, não aqui.
pre-push:
  jobs:
    - name: typecheck
      run: pnpm typecheck
